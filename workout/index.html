<div class="app">

  <header class="topbar">
    <div class="topbar__in">
      <button type="button" class="icon-btn icon-btn--back" id="back" hidden aria-label="Back">&larr;</button>
      <h1 class="topbar__title" id="title">
        Carissa
        <span class="topbar__sub" id="subtitle">The week</span>
      </h1>
      <!-- Only ever shown to a signed-in admin account (see canAdmin() in
           app.js) — nobody else sees it, signed in or not. Toggles between
           this account's own week and the admin view: the repositories, the
           roster, assigning workouts. -->
      <button type="button" class="admin-toggle" id="admin-toggle" hidden data-action="admin-toggle">Admin view</button>
      <button type="button" class="icon-btn" id="history-btn" aria-label="History" title="History">&#9202;</button>
      <button type="button" class="icon-btn" id="settings-btn" aria-label="Settings" title="Settings">&#9881;</button>
    </div>
  </header>

  <main id="main">
    <div class="wrap" id="screen">
      <!-- Every screen is rendered here by js/app.js. -->
      <p class="muted">Loading the week…</p>
    </div>
  </main>

</div>

<!-- The player's bottom bar lives outside the scrolling area so it stays
     under her thumb while the page scrolls behind it. -->
<div class="bar" id="bar" hidden><div class="bar__in" id="bar-in"></div></div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet__panel">
    <div class="sheet__head">
      <h2 id="sheet-title">Settings</h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">&times;</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<noscript>
  <div class="wrap">
    <p class="note note--warn">This app needs JavaScript. The workouts, the videos and the timer are all
    on this page rather than on a server, which is what lets it work in a gym with no signal.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
<script>
  /* Offline first. Registered here rather than in the module so a failure to
     register can never stop the app itself from starting.

     It also says so when a newer version takes over. Without that the app can
     be sitting on yesterday's code with no way for the person holding it to
     know — which is exactly how a fixed bug gets reported twice. It offers a
     reload rather than doing one: reloading underneath somebody mid-workout
     would be worse than the staleness. */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      var hadOne = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(function () { /* nothing to do */ });

      navigator.serviceWorker.addEventListener("controllerchange", function () {
        if (!hadOne) return;            // first ever install: nothing was stale
        if (document.getElementById("update-bar")) return;
        var bar = document.createElement("div");
        bar.id = "update-bar";
        bar.className = "update-bar";
        bar.innerHTML = '<span>A newer version is ready.</span>' +
                        '<button type="button">Reload</button>';
        bar.querySelector("button").addEventListener("click", function () {
          location.reload();
        });
        document.body.appendChild(bar);
      });
    });
  }
</script>
