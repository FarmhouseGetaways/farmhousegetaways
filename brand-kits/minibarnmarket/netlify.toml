# Mini Barn Market — Netlify config.
#
# ⚠ READ THIS BEFORE CONNECTING THE REPO TO THE LIVE SITE.
#
# This site is currently deployed by hand, and its build settings, redirects
# and headers live in the Netlify UI. The moment you connect this repo, THIS
# FILE takes over from those settings. Anything configured in the UI and not
# written down here is lost.
#
# So before you connect: open Netlify → Site configuration for minibarnmarket.netlify.app,
# and copy across anything under Build & deploy, Redirects, and Headers that
# is not already below. Then delete this warning.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# EmailOctopus setup and health check. Needs ?key=ADMIN_PASSWORD.
# There is deliberately no redirect for submission-created — Netlify calls
# that one itself after each verified form submission, and nothing should be
# able to reach it from outside.
[[redirects]]
  from = "/api/emailoctopus"
  to = "/.netlify/functions/emailoctopus-status"
  status = 200
