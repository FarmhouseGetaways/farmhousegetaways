# Farmhouse Getaways — Netlify config
# Static site. No build step.

# Both this site and Carissa's workout tracker (workout/netlify.toml) watch
# `main` on this one repository, so without the line below every push builds
# BOTH sites and every push costs twice what it should.
#
# `ignore` is a shell command Netlify runs before building, from this
# directory. Exit 0 means "nothing relevant changed, skip the build"; any
# other exit code means build. So: skip when the commit range touched nothing
# outside workout/.
#
# If $CACHED_COMMIT_REF is empty — a first build, a cleared cache, a manual
# deploy — git diff errors, which is a non-zero exit, which builds. The
# failure mode is an extra build, never a missed one. That is the right way
# round and is why this is not wrapped in anything cleverer.
[build]
  publish = "."
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)workout'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# ============================================================================
#  ⚠️  STAGING — THE SITE IS HIDDEN FROM GOOGLE
#
#  The block below tells every search engine not to index this site.
#  It is here on purpose while farmhousegetaways.com still points at the
#  old site.
#
#  >>> DELETE THIS ENTIRE BLOCK THE DAY YOU POINT THE DOMAIN HERE. <<<
#  >>> ALSO change robots.txt back to "Allow: /".                  <<<
#
#  If you forget, the site will be live and completely invisible in search.
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
# ============================ END STAGING BLOCK =============================


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# friendly alias for the publish function
[[redirects]]
  from = "/api/publish"
  to = "/.netlify/functions/publish"
  status = 200

# `publish = "."` serves every file in the repo, which would put the email
# source and the setup script on the public web. Neither holds a secret and the
# site is noindexed, but they are working files, not pages.
# force = true is required. Netlify serves a real file in preference to a
# redirect that matches it — "shadowing" — so without force these rules parse
# fine, deploy fine, and do absolutely nothing.
[[redirects]]
  from = "/emails/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# The handover notes. `publish = "."` was serving CLAUDE.md and EMAIL.md on the
# open web — checked 22 Aug 2026, both returned 200. They hold no password and
# must not, but they are working notes describing how the estate is wired, and
# that is not a page. README.md stays public; it is a normal repo readme.
#
# force = true is required, as with the rules above: Netlify prefers a real
# file to a redirect that matches it, so without it this does nothing.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/EMAIL.md"
  to = "/404.html"
  status = 404
  force = true

# Carissa's workout tracker lives in workout/ and is DELIBERATELY NOT PART OF
# THIS SITE. It is a separate Netlify site pointed at the same repository with
# the base directory set to `workout` — see workout/netlify.toml. The folder is
# in this repository only because that is where the branch was; it is not a
# page here and must not become one.
#
# `publish = "."` would otherwise serve the whole app at
# farmhousegetaways.com/workout/, on the wrong domain, without its functions,
# and with the plan readable by anyone who guessed the path.
#
# force = true is required. Netlify serves a real file in preference to a
# redirect that matches it — "shadowing" — so without it this rule parses fine,
# deploys fine, and does absolutely nothing.
[[redirects]]
  from = "/workout/*"
  to = "/404.html"
  status = 404
  force = true

# EmailOctopus setup and health check. Needs ?key=ADMIN_PASSWORD.
# There is no redirect for submission-created — Netlify calls that one itself
# on every verified form submission, and nothing should be able to reach it
# from outside.
[[redirects]]
  from = "/api/emailoctopus"
  to = "/.netlify/functions/emailoctopus-status"
  status = 200

# old URL kept alive after the Weddings page was renamed
[[redirects]]
  from = "/events.html"
  to = "/wedding-groups.html"
  status = 301

[[redirects]]
  from = "/events"
  to = "/wedding-groups"
  status = 301


# ============================================================================
#  OLD SITE URLs — DO NOT DELETE
#
#  The previous farmhousegetaways.com used these short paths. Google has them
#  indexed, and Farmstand.TV links to all three of them by hand. Without these
#  lines every one of those links 404s the moment the domain is pointed here.
# ============================================================================
[[redirects]]
  from = "/rbr"
  to = "/red-barn-ranch.html"
  status = 301

[[redirects]]
  from = "/mr"
  to = "/mountain-retreat.html"
  status = 301

# Industrial Mini Mansion — the tiny home. It had a page of its own on the old
# site; here it is a section of the Red Barn Ranch page.
[[redirects]]
  from = "/imm"
  to = "/red-barn-ranch.html"
  status = 301

[[redirects]]
  from = "/weddings"
  to = "/wedding-groups.html"
  status = 301

# The old site already ranked a farmstand map page at /map. Sending it to the
# new page hands that ranking over instead of throwing it away.
[[redirects]]
  from = "/map"
  to = "/ramona-farmstand-map.html"
  status = 301

[[redirects]]
  from = "/socialmedia"
  to = "/"
  status = 301

# Junk page Wix left behind, indexed by Google as "New Page".
[[redirects]]
  from = "/blank-2"
  to = "/"
  status = 301

# The old site sold the properties as film and photoshoot locations at /photo.
# Cory retired that line of business on 1 Aug 2026 — no page here, by choice.
# The redirect stays so the indexed URL lands somewhere useful instead of a 404.
[[redirects]]
  from = "/photo"
  to = "/"
  status = 301
