# Farmhouse Getaways — Netlify config
# Static site. No build step.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# ============================================================================
#  ⚠️  STAGING — THE SITE IS HIDDEN FROM GOOGLE
#
#  The block below tells every search engine not to index this site.
#  It is here on purpose while farmhousegetaways.com still points at the
#  old site.
#
#  >>> DELETE THIS ENTIRE BLOCK THE DAY YOU POINT THE DOMAIN HERE. <<<
#  >>> ALSO change robots.txt back to "Allow: /".                  <<<
#
#  If you forget, the site will be live and completely invisible in search.
# ============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
# ============================ END STAGING BLOCK =============================


[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ---------------------------------------------------------------------------
#  The workout tracker's own files.
#
#  The site's css and images are pinned for a year because their URLs carry a
#  version string. The app's do not — it is a folder of plain files that get
#  edited — so they are revalidated instead. The service worker and the
#  manifest are the important ones: cache either and a phone that installed
#  the app keeps serving an old copy for ever, with no way to reach it.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/workout/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workout/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workout/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/json; charset=utf-8"

[[headers]]
  for = "/workout/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workout/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# friendly alias for the publish function
[[redirects]]
  from = "/api/publish"
  to = "/.netlify/functions/publish"
  status = 200

# `publish = "."` serves every file in the repo, which would put the email
# source and the setup script on the public web. Neither holds a secret and the
# site is noindexed, but they are working files, not pages.
# force = true is required. Netlify serves a real file in preference to a
# redirect that matches it — "shadowing" — so without force these rules parse
# fine, deploy fine, and do absolutely nothing.
[[redirects]]
  from = "/emails/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

# The workout record is never served over the web, whatever ends up in that
# file. `publish = "."` would otherwise hand a year of somebody's training log
# to anyone who guessed the path. force = true is required — Netlify serves a
# real file in preference to a redirect that matches it, so without it this
# rule parses fine, deploys fine, and does nothing at all.
[[redirects]]
  from = "/workout/data/history.json"
  to = "/404.html"
  status = 404
  force = true

# Carissa's workout tracker at /workout/. Reads the plan without a password;
# writing the plan or logging a workout needs ADMIN_PASSWORD, the same one that
# guards /api/publish and /api/emailoctopus. The function stores everything as
# JSON committed to this repository — see netlify/functions/workout.mjs.
[[redirects]]
  from = "/api/workout"
  to = "/.netlify/functions/workout"
  status = 200

# A short way in, for a home-screen shortcut.
[[redirects]]
  from = "/workout"
  to = "/workout/"
  status = 301

# EmailOctopus setup and health check. Needs ?key=ADMIN_PASSWORD.
# There is no redirect for submission-created — Netlify calls that one itself
# on every verified form submission, and nothing should be able to reach it
# from outside.
[[redirects]]
  from = "/api/emailoctopus"
  to = "/.netlify/functions/emailoctopus-status"
  status = 200

# old URL kept alive after the Weddings page was renamed
[[redirects]]
  from = "/events.html"
  to = "/wedding-groups.html"
  status = 301

[[redirects]]
  from = "/events"
  to = "/wedding-groups"
  status = 301


# ============================================================================
#  OLD SITE URLs — DO NOT DELETE
#
#  The previous farmhousegetaways.com used these short paths. Google has them
#  indexed, and Farmstand.TV links to all three of them by hand. Without these
#  lines every one of those links 404s the moment the domain is pointed here.
# ============================================================================
[[redirects]]
  from = "/rbr"
  to = "/red-barn-ranch.html"
  status = 301

[[redirects]]
  from = "/mr"
  to = "/mountain-retreat.html"
  status = 301

# Industrial Mini Mansion — the tiny home. It had a page of its own on the old
# site; here it is a section of the Red Barn Ranch page.
[[redirects]]
  from = "/imm"
  to = "/red-barn-ranch.html"
  status = 301

[[redirects]]
  from = "/weddings"
  to = "/wedding-groups.html"
  status = 301

# The old site already ranked a farmstand map page at /map. Sending it to the
# new page hands that ranking over instead of throwing it away.
[[redirects]]
  from = "/map"
  to = "/ramona-farmstand-map.html"
  status = 301

[[redirects]]
  from = "/socialmedia"
  to = "/"
  status = 301

# Junk page Wix left behind, indexed by Google as "New Page".
[[redirects]]
  from = "/blank-2"
  to = "/"
  status = 301

# The old site sold the properties as film and photoshoot locations at /photo.
# Cory retired that line of business on 1 Aug 2026 — no page here, by choice.
# The redirect stays so the indexed URL lands somewhere useful instead of a 404.
[[redirects]]
  from = "/photo"
  to = "/"
  status = 301
