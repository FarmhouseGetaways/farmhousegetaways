# Builds the Windows version of Cat Fighter II and attaches it to the run.
#
# Nothing here touches the website. It only fires for changes under
# catfighter/, or when started by hand from the Actions tab.
#
# To get a build: GitHub -> Actions -> "Cat Fighter II (Windows)" ->
# "Run workflow". When it finishes, download the artifact at the bottom of the
# run page. It contains both an installer (.exe) and a portable .zip.

name: Cat Fighter II (Windows)

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'catfighter/**'
      - '.github/workflows/catfighter-windows.yml'

permissions:
  contents: read

jobs:
  test:
    name: Frame data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run the engine tests
        working-directory: catfighter
        run: node --test test/*.test.mjs

  build:
    name: Windows build
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tooling
        working-directory: catfighter
        run: npm install --no-audit --no-fund

      - name: Build installer and portable zip
        working-directory: catfighter
        run: npm run dist:win
        env:
          # electron-builder tries to sign by default; we have no certificate,
          # so tell it plainly rather than letting it fail late.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: CatFighterII-windows
          path: |
            catfighter/dist/*.exe
            catfighter/dist/*.zip
          if-no-files-found: error
          retention-days: 30
